name: Bug report
description: Report a bug to help us improve Lucky Engine
labels: ["bug"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report. Please fill out the sections below.
  - type: input
    id: version
    attributes:
      label: Version
      description: Engine version this occurred on
      placeholder: "2026.1"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the behavior?
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
    validations:
      required: false
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. You can drag-and-drop or paste screenshots, videos and .zip files here.
    validations:
      required: false
  - type: input
    id: os
    attributes:
      label: Operating System
      description: On Linux, also include your desktop environment and display server (e.g. GNOME / Wayland).
      placeholder: e.g. Windows 11 - macOS 14 - Ubuntu 24.04 (GNOME / Wayland)
    validations:
      required: false
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: CPU and GPU
      placeholder: e.g. Ryzen 9 7950X, RTX 4070
    validations:
      required: false
